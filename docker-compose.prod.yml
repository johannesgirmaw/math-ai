# Production stack for math-si.felegemetsahft.com
# Host Nginx terminates TLS and proxies to 127.0.0.1:3003.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mathsi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mathsi}
    volumes:
      - mathsi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mathsi} -d ${POSTGRES_DB:-mathsi}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mathsi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mathsi}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - ./apps/web/public/download:/app/apps/web/public/download
    depends_on:
      db:
        condition: service_healthy

volumes:
  mathsi_pgdata:
